apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer-service
  namespace: default
  labels:
    app: producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
        - name: producer
          image: devops-producer:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: moveo-stack-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
