version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: devops-frontend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      ENV_NAME: "Production-Kubernetes-Cluster"
    restart: always

  producer:
    build:
      context: ./apps/producer
      dockerfile: Dockerfile
    container_name: devops-producer
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: "kafka:9092"
      TOPIC_NAME: "moveo-challenge-topic"
    restart: always

  consumer:
    build:
      context: ./apps/consumer
      dockerfile: Dockerfile
    container_name: devops-consumer
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: "kafka:9092"
      TOPIC_NAME: "moveo-challenge-topic"
    restart: always
