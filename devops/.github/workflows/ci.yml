name: DevOps CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-build:
    name: Lint & Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Hadolint Dockerfile Linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "devops/apps/frontend/Dockerfile"
          ignore: "DL3018,DL3007"

      - name: Build Frontend Image
        run: |
          docker build -t moveo-frontend:ci ./devops/apps/frontend

      - name: Build Producer Image
        run: |
          docker build -t moveo-producer:ci ./devops/apps/producer

      - name: Build Consumer Image
        run: |
          docker build -t moveo-consumer:ci ./devops/apps/consumer
